[project]
name = "manga-upscaler-desktop"
version = "5.0.0"
description = "Local Windows manga upscaler with resumable jobs"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["ui_runtime", "runtime"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
